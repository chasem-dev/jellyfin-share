services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - share-portal
    environment:
      SHARE_DOMAIN: ${SHARE_DOMAIN:?Set SHARE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.distribution:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
